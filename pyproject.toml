[project]
name = "rag-search-engine"
version = "0.1.0"
description = "Keyword (BM25) and semantic search over a movie dataset, built as the retrieval layer for a RAG pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "python-dotenv==1.1.0",
    "sentence-transformers>=6.2.0",
    "transformers>=5.22.1",
]

[project.scripts]
keyword-search = "keyword_search_cli:main"
semantic-search = "semantic_search_cli:main"
hybrid-search = "hybrid_search_cli:main"
evaluation = "evaluation_cli:main"
augmented-generation = "augmented_generation_cli:main"
describe-image = "describe_image_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 88  # match Black, which VS Code formats with on save
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length; it intentionally leaves long strings/comments alone.
ignore = ["E501"]
