[project]
name = "rag-search-engine"
version = "1.0.0"
description = "Production-grade, agentic RAG over technical documentation (Python, Go, JavaScript, React, React Native, Kubernetes, backend and frontend system design): hybrid search, multimodal diagrams and evaluation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Akash Gupta" }]
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "fastembed>=0.7",
    "httpx>=0.28",
    "markdownify>=1.1",
    "openai>=2.0",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "qdrant-client>=1.14",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "RET"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"src/rag/prompts/*.py" = ["E501"]
